<!doctype html><html lang="sr-Latn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title data-kt>Kravos Tab</title>
<meta data-kt name="claude:viewport-fit-sides" content="cover">
<style data-kt>
/* Layout: one column — song shelf on top, a single hint line, the tab sheet, and a transport strip with the level switch. */
:root{
  --bg:#EEF0EE; --sheet:#FCFCFB; --ink:#15191F; --muted:#5E6670; --line:#D5D9D6; --chip:#E3E6E3;
  --accent:#C8102E; --accent-ink:#FFFFFF; --hint:#15191F; --hint-ink:#F3F4F2;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101317; --sheet:#171B21; --ink:#E9ECEF; --muted:#97A0AA; --line:#2A3038; --chip:#222830;
  --accent:#FF4D5E; --accent-ink:#15050A; --hint:#22282F; --hint-ink:#E9ECEF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101317; --sheet:#171B21; --ink:#E9ECEF; --muted:#97A0AA; --line:#2A3038; --chip:#222830;
  --accent:#FF4D5E; --accent-ink:#15050A; --hint:#22282F; --hint-ink:#E9ECEF; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{font:700 15px/1 var(--f-display);letter-spacing:.02em;white-space:nowrap}
.brand i{font-style:normal;color:var(--accent)}
.shelf{display:flex;align-items:center;gap:8px;flex:1;min-width:0;flex-wrap:wrap}
#songSel{flex:1;min-width:0;max-width:420px;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 10px;font:500 14px var(--f-body)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);padding-inline:8px}
.btn svg{width:15px;height:15px;flex:none}
input[type=file]{display:none}

.hint{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;padding-block:10px;background:var(--hint);color:var(--hint-ink);min-height:44px}
.hint b{font:500 14px var(--f-display);letter-spacing:.01em}
.hint .prog{font:700 14px var(--f-mono)}
.hint .tip{font-size:14.5px;opacity:.9}
.banner{padding-block:7px;font-size:13.5px;border-bottom:1px solid var(--line);background:color-mix(in srgb,#C98A00 22%,var(--bg))}
.mono{font-family:var(--f-mono);font-weight:700}

#scroll{flex:1;min-height:0;overflow:auto;background:var(--sheet);position:relative}
#at{min-height:200px}
.at-cursor-bar{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.at-cursor-beat{background:var(--accent);width:3px}
.at-selection div{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.at-highlight *{fill:var(--accent);stroke:var(--accent)}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none}

footer.transport{border-top:1px solid var(--line);background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.play{width:50px;height:50px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:20px;height:20px}
.round{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;cursor:pointer;flex:none}
.round svg{width:15px;height:15px}
.time{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.levels{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--sheet)}
.levels button{border:0;background:none;padding:8px 16px;cursor:pointer;font-weight:600;font-size:14px}
.levels button + button{border-left:1px solid var(--line)}
.levels button.on{background:var(--ink);color:var(--bg)}
.speed{display:flex;align-items:center;gap:8px;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.speed input{width:120px;accent-color:var(--accent)}
.sp{flex:1}
.grpl{display:flex;align-items:center;gap:8px}
.lbl{font-size:13px;color:var(--muted)}
.more{position:relative}
.more summary{list-style:none}
.more summary::-webkit-details-marker{display:none}
.more[open] summary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.more .menu{position:absolute;bottom:calc(100% + 8px);left:0;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:260px;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgb(0 0 0 / .18);z-index:10}
.more .menu.down{bottom:auto;top:calc(100% + 8px);left:auto;right:0}
.set .menu span{font-size:14px}
.upd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;background:color-mix(in srgb,var(--accent) 14%,var(--bg));font-size:14px}
.more .menu label{display:flex;gap:9px;align-items:center;font-size:14px;cursor:pointer}
.more .menu input{accent-color:var(--accent);width:16px;height:16px;flex:none}

body.cards #hint,body.cards #tuneBanner,body.cards #scroll,body.cards footer.transport,body.cards .shelf>:not(.set){display:none!important}
body.cards #cardsView{display:grid!important}
.views button{padding:7px 14px}
#cardsView{flex:1;min-height:0;grid-template-columns:300px minmax(0,1fr);overflow:hidden}
.clist{overflow:auto;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:6px}
.clist .prog{font:500 12px var(--f-mono);color:var(--muted);padding:2px 4px 8px}
.ci{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;align-items:center;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:9px 10px;cursor:pointer;width:100%}
.ci:hover{background:var(--sheet)}
.ci.on{background:var(--sheet);border-color:var(--line)}
.ci .n{grid-row:span 2;width:28px;height:28px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font:700 12px var(--f-mono)}
.ci.on .n{background:var(--accent);color:var(--accent-ink)}
.ci.done .n{background:var(--ink);color:var(--bg)}
.ci b{font-weight:600;font-size:14.5px;line-height:1.25}
.ci small{grid-column:2;color:var(--muted);font-size:12.5px}
.ci .ck{grid-row:span 2;color:var(--accent);font-weight:700}
.card{overflow:auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 40px 28px;display:flex;flex-direction:column;gap:18px;max-width:760px}
.card h2{font:700 24px/1.15 var(--f-display);margin:0;text-wrap:balance}
.card .by{color:var(--muted);font-size:14px;margin-top:4px}
.chip{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 12px;font-weight:600;font-size:13.5px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px}
.facts span{color:var(--muted)}
.facts b{font-weight:600;color:var(--ink)}
.chords{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.chords dt{color:var(--muted);font-size:13.5px}
.chords dd{margin:0;font:700 14.5px/1.4 var(--f-mono)}
.card h3{font:600 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.card p{margin:0;font-size:15.5px;line-height:1.6;max-width:64ch}
.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ex label{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:15px;line-height:1.5}
.ex input{accent-color:var(--accent);width:18px;height:18px;margin-top:2px}
.ex label:has(input:checked) span{color:var(--muted);text-decoration:line-through}
.cnav{display:flex;flex-wrap:wrap;gap:8px}
.src{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.src a{color:var(--muted)}
@media (max-width:700px){
  #cardsView{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .clist{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;gap:6px}
  .clist .prog{display:none}
  .ci{grid-template-columns:auto;padding:6px;width:auto}
  .ci b,.ci small,.ci .ck{display:none}
  .ci .n{grid-row:auto}
  .card{padding:16px max(16px,env(safe-area-inset-left,0px)) 32px;gap:16px}
  .card h2{font-size:21px}
}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
#drop{position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 18%,transparent);border:3px dashed var(--accent);display:grid;place-items:center;font:700 20px var(--f-display);z-index:30;pointer-events:none}
@media (max-width:700px){
  .brand{display:none}
  header.top{gap:8px}
  #songSel{max-width:none}
  .speed input{width:84px}
  .sp{display:none}
  footer.transport{gap:8px 10px}
}
@media (max-height:520px){
  .brand{display:none}
  header.top{padding-block:6px}
  .hint{padding-block:5px;min-height:0}
  footer.transport{padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));gap:6px 10px}
  .play{width:40px;height:40px}
  .round{width:32px;height:32px}
  .levels button{padding:6px 12px}
}
</style>

<header data-kt class="top gut">
  <span class="brand">KRAVOS <i>TAB</i></span>
  <div class="levels views" id="viewSw" role="tablist" aria-label="Prikaz"><button data-v="cards" role="tab">Kartice</button><button data-v="tab" role="tab">Tab</button></div>
  <div class="shelf">
    <select id="songSel" aria-label="Moje pesme"></select>
    <button class="btn" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Sa telefona</button>
    <button class="btn quiet" id="delBtn" hidden>Ukloni</button>
    <details class="more set" id="setMenu"><summary class="btn" aria-label="Podešavanja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></summary>
      <div class="menu down">
        <span id="setDrive"></span>
        <button class="btn" id="connectBtn">Poveži Google Drive</button>
        <button class="btn" id="refreshBtn">Osveži listu pesama</button>
        <span class="lbl">Pesme se čitaju iz foldera „Kravos Tab“ na tvom Drive-u.</span>
        <span class="lbl" id="setVer"></span>
      </div>
    </details>
  </div>
</header>
<div data-kt id="cardsView" hidden>
  <nav class="clist" id="cList" aria-label="Pesme po redu"></nav>
  <article class="card" id="cCard"></article>
</div>
<div class="upd gut" id="updBar" hidden><span id="updText"></span><button class="btn warn" id="updBtn">Instaliraj</button><button class="btn quiet" id="updLater">Kasnije</button></div>
<div data-kt class="hint gut" id="hint"><b id="hSec">—</b><span class="prog" id="hProg"></span><span class="tip" id="hTip"></span></div>
<div data-kt class="banner gut" id="tuneBanner" hidden></div>
<div data-kt id="scroll"><div id="at"></div><div id="loading">Učitavam…</div></div>
<footer data-kt class="transport gut">
  <button class="play" id="playBtn" aria-label="Pusti"><svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M7 4l13 8-13 8z"/></svg></button>
  <button class="round" id="stopBtn" aria-label="Na početak"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
  <span class="time" id="time">0:00</span>
  <div class="grpl"><span class="lbl">Bas</span><div class="levels" id="bassVol" role="radiogroup" aria-label="Jačina basa">
    <button data-v="1" role="radio" class="on">Glasno</button>
    <button data-v="0.35" role="radio">Tiho</button>
    <button data-v="0" role="radio">Bez</button>
  </div></div>
  <details class="more" id="more"><summary class="btn">Detalji</summary>
    <div class="menu">
      <label><input type="checkbox" id="optChords" checked>Akordi iznad taba</label>
      <label><input type="checkbox" id="optRoot" checked>Oznake R i 5 na notama</label>
      <label><input type="checkbox" id="optAll">Sve funkcije nota (3, b7, prolazne…)</label>
      <label><input type="checkbox" id="optHint" checked>Saveti po delovima pesme</label>
      <label><input type="checkbox" id="optStd">Note iznad taba</label>
    </div>
  </details>
  <span class="sp"></span>
  <div class="speed"><label for="speed">Tempo</label><input type="range" id="speed" min="40" max="120" step="5" value="100"><span id="speedVal">100%</span></div>
  <button class="btn" id="loopBtn">Ponavljaj deo</button>
</footer>
<div data-kt id="toast" hidden></div>
<div data-kt id="drop" hidden>Pusti .gp fajl ovde</div>

<script src="alphaTab.min.js"></script>
<script data-kt>
// Kratki saveti po delu pesme. Ključ: naslov pesme malim slovima.
const BUILTIN_LESSONS = {
  "wasted years": {
    intro: "Bas ćuti prva četiri takta, pa drži E ispod gitarskog rifa.",
    verse: "Em – D – C. Koren na svakoj osminki, ti si puls.",
    chorus: "G – C – Am – D. E je zajednički ton za C i Am.",
    bridge: "Opet Em – D – C, ali sporije. Mesto za tvoj filer.",
    solo: "Em – D – C ispod sola. Bas malo šeta, koren na prvoj dobi.",
    outro: "Ponavlja uvod i spušta se na E."
  }
};

// Kartice: osam pesama iz seta, svaka uči jedan pojam iz teorije. Redosled je redosled učenja.
const CARDS = [
  {
    id: "tnt", title: "T.N.T.", artist: "AC/DC", year: "1975",
    concept: "Koren i puls",
    facts: [["Tonalitet", "E (između dura i mola)"], ["Tempo", "oko 126 BPM"]],
    chords: [["Rif i refren", "A – G – E (iv – ♭III – i)"]],
    theory: "Sve počinje od korena: nota po kojoj se akord zove. Bas svira ravne osminke na korenu i menja notu tačno kad i gitara. G iznad E je mala terca (♭III), zato pesma zvuči „prljavo“ rokerski, iako nema mol akorda u klasičnom smislu.",
    listen: "Bas i bas-bubanj udaraju zajedno. Pauze u refrenu su deo ritma, tišina mora da bude tačna koliko i nota.",
    exercises: [
      "Uz snimak sviraj samo cele note na korenu: E, G, A. Cilj je da čuješ gde se akord menja.",
      "Isto u ravnim osminkama na 70% tempa. Bez ubrzavanja, svaka osminka jednaka.",
      "Ceo refren uz snimak, brojeći u sebi „1 i 2 i“. Promena akorda pada tačno na 1."
    ],
    sources: [["Hooktheory: T.N.T.", "https://www.hooktheory.com/theorytab/view/ac-dc/tnt"], ["Jon MacLennan: TNT chords", "https://www.jonmaclennan.com/blog/tnt-chords"]]
  },
  {
    id: "paranoid", title: "Paranoid", artist: "Black Sabbath", year: "1970",
    concept: "Mol pentatonika",
    facts: [["Tonalitet", "E mol"]],
    chords: [["Cela pesma", "E5, D5, G5, C5 (pauer akordi)"]],
    theory: "E mol pentatonika je pet nota: E G A H D. Nema polustepena između njih, zato nijedna ne „smeta“ preko rok akorda. To je prva „kutija“ na vratu koju treba da znaš napamet.",
    listen: "Geezer i Iommi sviraju rif zajedno, bas oktavu niže. Geezer kaže da baš to daje Sabbath rifovima težinu. Čuje se kao jedan debeo instrument.",
    exercises: [
      "Nađi E mol pentatoniku u prvoj poziciji (prazne žice i 2–3. prag) i sviraj je gore-dole.",
      "Sviraj rif uz snimak i prepoznaj koje note pentatonike koristi.",
      "Improvizuj samo iz pentatonike preko solo dela. Nijedna nota neće zvučati pogrešno."
    ],
    sources: [["Wikipedia: Paranoid", "https://en.wikipedia.org/wiki/Paranoid_(Black_Sabbath_song)"], ["Jon MacLennan: Paranoid chords", "https://www.jonmaclennan.com/blog/paranoid-chords"], ["Guitar World: Geezer Butler", "https://www.guitarworld.com/features/geezer-butlers-10-best-basslines-with-black-sabbath"]]
  },
  {
    id: "aceofspades", title: "Ace of Spades", artist: "Motörhead", year: "1980",
    concept: "Kvinta i dvozvuk",
    facts: [["Štim", "pola tona niže (E♭)"], ["Centar", "glavni rif na A"]],
    chords: [["Glavni rif", "A"], ["Strofe", "menja se ispod glavnog rifa, nađi po uhu"]],
    theory: "Kvinta (5) je nota sedam polustepena iznad korena. Na basu je uvek na istom mestu: dva praga više na susednoj tanjoj žici. Koren i kvinta zajedno su pauer akord na basu. Lemmy je bas svirao kao gitaru: dvozvuci, prazna žica koja zvoni i melodija na nižoj žici.",
    listen: "Bas zvuči kao ritam gitara, distorzija i puni akordi. Ne traži pojedinačne note, traži oblik.",
    exercises: [
      "Sviraj koren i kvintu zajedno na A, D, G i C. Oblik prstiju je uvek isti.",
      "Uz snimak prvo samo koren u osminkama, pa pređi na dvozvuk koren i kvinta.",
      "Nađi po uhu gde se u strofi menja akord i na koji. Bez taba, ovo je vežba za uvo."
    ],
    sources: [["TalkingBass: Ace of Spades", "https://www.talkingbass.net/heaviest-bass-riff-of-all-time-ace-of-spades/"], ["Guitar World: Lemmy", "https://guitarworld.com/features/lemmys-5-greatest-basslines-with-motorhead"]]
  },
  {
    id: "wastedyears", title: "Wasted Years", artist: "Iron Maiden", year: "1986",
    concept: "i – ♭VII – ♭VI",
    facts: [["Tonalitet", "E mol"], ["Tempo", "oko 154 BPM"]],
    chords: [["Strofa", "Em – D – C"], ["Refren", "G – C – Am – D – C – Am – Em – D"]],
    theory: "Em – D – C je najčešći metal pokret u molu: tonika, pa dva koraka dole. Refren kreće od G (paralelni dur), zato zvuči vedrije iako su note iste. Gitare menjaju akord osminku ranije (anticipacija), a bas prati.",
    listen: "Poslednja osminka pred taktnu crtu često nije koren, to je „guranje“ akorda unapred. Pred kraj refrena bas se hromatski penje ka G.",
    exercises: [
      "Samo koreni: E, D, C u strofi, G, C, A, D u refrenu.",
      "Prilaz odozdo: poslednja osminka pred promenu je polustepen ispod novog korena (D# pred E, H pred C).",
      "U refrenu drži E preko C i Am. To je terca C-dura i kvinta Am, zajednički ton."
    ],
    sources: [["Analiza tvog GP fajla (Kravos Tab)", ""]]
  },
  {
    id: "aintalkin", title: "Ain't Talkin' 'bout Love", artist: "Van Halen", year: "1978",

const KS_MAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],KS_MIN=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];

  <section><h3>Teorija</h3><p>${escC(c.theory)}</p></section>

  <section><h3>Vežbe uz snimak</h3><ol class="ex">${c.exercises.map((x,k)=>`<li><label><input type="checkbox" data-ex="${k}" ${e[k]?'checked':''}><span>${escC(x)}</span></label></li>`).join('')}</ol></section>
  <div class="cnav">${song?`<button class="btn" id="cOpen">Otvori tab</button>`:''}${i+1<CARDS.length?`<button class="btn" id="cNext">Sledeća: ${escC(CARDS[i+1].title)} →</button>`:''}</div>
  <div class="src">Izvori: ${c.sources.map(s=>s[1]?`<a href="${escC(s[1])}" target="_blank" rel="noopener">${escC(s[0])}</a>`:`<span>${escC(s[0])}</span>`).join('')}</div>`;
  $('#cCard').scrollTop=0;
  const n=$('#cNext');if(n)n.onclick=()=>{CV.cur=CARDS[i+1].id;store.set('kt-card',CV.cur);renderCards()};
  const o=$('#cOpen');if(o)o.onclick=()=>{setView('tab');openSong(song)};
}
$('#cList').onclick=e=>{const b=e.target.closest('.ci');if(!b)return;CV.cur=b.dataset.id;store.set('kt-card',CV.cur);renderCards()};
$('#cCard').onchange=e=>{const x=e.target.closest('[data-ex]');if(!x)return;const s=exState(CV.cur);s[+x.dataset.ex]=x.checked;store.set('kt-ex:'+CV.cur,s);
  const keep=$('#cCard').scrollTop;renderCards();$('#cCard').scrollTop=keep};
function setView(v){
  document.body.classList.toggle('cards',v==='cards');$('#cardsView').hidden=v!=='cards';store.set('kt-view',v);
  $$('#viewSw button').forEach(b=>{const on=b.dataset.v===v;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
  if(v==='cards')renderCards();else{api.stop();setTimeout(()=>api.render(),0)}
}
$$('#viewSw button').forEach(b=>b.onclick=()=>setView(b.dataset.v));

// ---------- library (Android: Google Drive folder "Kravos Tab" + files on the phone) ----------
const N=window.KravosNative;
const LIB={songs:[],cache:new Map(),first:true,want:null,state:{}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function cleanName(n){return String(n).replace(/\.[^.]+$/,'').replace(/_/g,' ').replace(/\s+ver\s*\d+.*$/i,'').replace(/\s+by\s+\S+$/i,'').trim()}
function songTitle(s){const t=store.get('kt-title:'+s.id);return t?t.title+(t.artist?' · '+t.artist:''):cleanName(s.name)}
function renderShelf(){
  const sel=$('#songSel');
  const opts=LIB.songs.map(s=>`<option value="${esc(s.id)}">${esc(songTitle(s))}${s.local?' (telefon)':''}</option>`);
  if(!S.songId)opts.unshift('<option value="">Vežba R–5–8 (primer)</option>');
  sel.innerHTML=opts.join('');sel.value=S.songId||'';
  const cur=LIB.songs.find(s=>s.id===S.songId);$('#delBtn').hidden=!(cur&&cur.local);
}
function openSong(id){
  const data=LIB.cache.get(id);
  if(data){openSrc({kind:'bytes',data},id);afterOpen(id);return}
  LIB.want=id;$('#loading').hidden=false;N.load(id);
}
function afterOpen(id){
  if(S.score&&id)store.set('kt-title:'+id,{title:S.score.title||'',artist:S.score.artist||''});
  renderShelf();
}
window.KT={
  onSongs(list,err){
    LIB.songs=(list||[]).slice().sort((a,b)=>songTitle(a).localeCompare(songTitle(b)));
    if(LIB.first&&LIB.songs.length){LIB.first=false;const last=store.get('kt-last'),pick=LIB.songs.find(s=>s.id===last)||LIB.songs[0];openSong(pick.id)}
    renderShelf();updateSettings();
    if(err&&!document.body.classList.contains('cards'))toast(err,5000);
  },
  onSong(id,b64){
    let data;try{data=b64bytes(b64)}catch(e){toast('Pesma nije učitana.');return}
    LIB.cache.set(id,data);
    if(LIB.want===id){LIB.want=null;openSrc({kind:'bytes',data},id);afterOpen(id)}
  },
  onLocalAdded(id){LIB.cache.delete(id);openSong(id)},
  onError(msg){$('#loading').hidden=true;LIB.want=null;toast(msg,5000)},
  onAuth(state){LIB.state=state||{};updateSettings();if(LIB.state.connected)N.refresh()},
  onUpdate(info){LIB.update=info;updateSettings();if(info)$('#updBar').hidden=false},
  onUpdateProgress(p){$('#updBtn').textContent=p>=1?'Instaliram…':'Preuzimam '+Math.round(p*100)+'%'}
};
function updateSettings(){
  const st=LIB.state||{};
  $('#setDrive').textContent=st.connected?('Google Drive: povezan'+(st.account?' ('+st.account+')':'')):'Google Drive nije povezan';
  $('#connectBtn').hidden=!!st.connected;
  $('#setVer').textContent='Verzija '+(st.version||'?');
  const u=LIB.update;
  $('#updText').textContent=u?('Nova verzija '+u.name):'';
}
let delArmed=false;
$('#delBtn').onclick=()=>{
  if(!delArmed){delArmed=true;$('#delBtn').textContent='Sigurno ukloniti?';$('#delBtn').classList.add('warn');setTimeout(()=>{delArmed=false;$('#delBtn').textContent='Ukloni';$('#delBtn').classList.remove('warn')},4000);return}
  delArmed=false;$('#delBtn').textContent='Ukloni';$('#delBtn').classList.remove('warn');
  const id=S.songId;if(!id)return;N.removeLocal(id);LIB.cache.delete(id);S.songId=null;openSrc({kind:'tex',data:DEMO},null);
};
$('#songSel').onchange=e=>{const v=e.target.value;if(v)openSong(v);else openSrc({kind:'tex',data:DEMO},null)};
$('#addBtn').onclick=()=>N.openLocal();
$('#connectBtn').onclick=()=>N.connect();
$('#refreshBtn').onclick=()=>{N.refresh();toast('Osvežavam listu…')};
$('#updBtn').onclick=()=>N.installUpdate();
$('#updLater').onclick=()=>{$('#updBar').hidden=true};
document.addEventListener('click',e=>{const m=$('#setMenu');if(m.open&&!m.contains(e.target))m.open=false});
function initLibrary(){
  if(!N){toast('Pokreni ovo u aplikaciji Kravos Tab.');return}
  try{LIB.state=JSON.parse(N.state())}catch(e){}
  updateSettings();
  N.refresh();
  setTimeout(()=>N.checkUpdate(),2500);
}

// ---------- transport ----------
function highlight(sec){const bars=S.score.tracks[S.track].staves[0].bars,lb=bars[sec.end].voices[0].beats;try{api.highlightPlaybackRange(bars[sec.start].voices[0].beats[0],lb[lb.length-1]);api.applyPlaybackRangeFromHighlight()}catch(e){}}
$('#loopBtn').onclick=()=>{
  if(S.loop){S.loop=false;S.loopSec=null;$('#loopBtn').classList.remove('on');api.isLooping=false;api.playbackRange=null;try{api.clearPlaybackRangeHighlight()}catch(e){}return}
  const sec=curSec||S.sections[0];S.loop=true;S.loopSec=sec;highlight(sec);api.isLooping=true;$('#loopBtn').classList.add('on');
  const lk=api.tickCache&&api.tickCache.masterBars.find(m=>m.masterBar.index===sec.start);if(lk&&api.playerState!==1)api.tickPosition=lk.start;
  toast('Ponavlja se: '+sec.label);
};
$('#playBtn').onclick=()=>api.playPause();
$('#stopBtn').onclick=()=>{api.stop();if(S.loop&&api.playbackRange)api.tickPosition=api.playbackRange.startTick};
$('#speed').oninput=e=>{$('#speedVal').textContent=e.target.value+'%';api.playbackSpeed=+e.target.value/100};
$$('#bassVol button').forEach(b=>b.onclick=()=>{OPT.bass=+b.dataset.v;$$('#bassVol button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-checked',x===b)});saveOpt();applyOpts()});
function saveOpt(){store.set('kt-opt',OPT)}
function loadOpt(){const o=store.get('kt-opt');if(o)Object.assign(OPT,o);
  $('#optChords').checked=OPT.chords;$('#optRoot').checked=OPT.root;$('#optAll').checked=OPT.all;$('#optHint').checked=OPT.hint;$('#optStd').checked=OPT.std;
  $('#hint').hidden=!OPT.hint;$$('#bassVol button').forEach(x=>{const on=+x.dataset.v===OPT.bass;x.classList.toggle('on',on);x.setAttribute('aria-checked',on)});
  api.settings.display.staveProfile=OPT.std?AT.StaveProfile.ScoreTab:AT.StaveProfile.Tab;api.updateSettings()}
$('#optChords').onchange=e=>{OPT.chords=e.target.checked;saveOpt();relabel()};
$('#optRoot').onchange=e=>{OPT.root=e.target.checked;if(OPT.root){OPT.all=false;$('#optAll').checked=false}saveOpt();relabel()};
$('#optAll').onchange=e=>{OPT.all=e.target.checked;if(OPT.all){OPT.root=false;$('#optRoot').checked=false}saveOpt();relabel()};
$('#optHint').onchange=e=>{OPT.hint=e.target.checked;$('#hint').hidden=!OPT.hint;saveOpt()};
$('#optStd').onchange=e=>{OPT.std=e.target.checked;saveOpt();api.settings.display.staveProfile=OPT.std?AT.StaveProfile.ScoreTab:AT.StaveProfile.Tab;api.updateSettings();api.render()};
document.addEventListener('click',e=>{const m=$('#more');if(m.open&&!m.contains(e.target))m.open=false});
addEventListener('keydown',e=>{if(e.target.closest('input,select'))return;if(e.code==='Space'){e.preventDefault();api.playPause()}});
const reTheme=()=>{colorize(api.settings);api.updateSettings();api.render()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',reTheme);
new MutationObserver(reTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

openSrc({kind:'tex',data:DEMO},null);renderShelf();
setView(store.get('kt-view')||'cards');
